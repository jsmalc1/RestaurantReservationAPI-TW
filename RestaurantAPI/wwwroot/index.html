<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Restoran - Autentifikacija</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            background: #f4f4f9;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        input, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background-color: #0056b3;
            }

        .toggle-link {
            color: #007bff;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-top: 10px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="formTitle">Prijava u sustav</h2>

        <!-- Forma za prijavu -->
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Lozinka" required>
            <button onclick="login()">Prijavi se</button>
            <span class="toggle-link" onclick="toggleForm('register')">Nemaš račun? Registriraj se</span>
        </div>

        <!-- Forma za registraciju -->
        <div id="registerForm" style="display: none;">
            <input type="text" id="regFirstName" placeholder="Ime" required>
            <input type="text" id="regLastName" placeholder="Prezime" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Lozinka" required>
            <button onclick="register()">Registriraj se</button>
            <span class="toggle-link" onclick="toggleForm('login')">Imaš račun? Prijavi se</span>
        </div>

        <p id="msg" style="text-align: center; font-weight: bold;"></p>
    </div>

    <script>
        const API_URL = "/api/auth";

        function toggleForm(type) {
            document.getElementById('msg').innerText = "";
            if (type === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('formTitle').innerText = 'Registracija';
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('formTitle').innerText = 'Prijava u sustav';
            }
        }

        async function login() {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const msg = document.getElementById("msg");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("jwt_token", data.token);
                    window.location.href = "dashboard.html";
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Pogrešan email ili lozinka.";
                }
            } catch (error) { msg.innerText = "Greška u komunikaciji sa serverom."; }
        }

        async function register() {
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;
            const firstName = document.getElementById("regFirstName").value;
            const lastName = document.getElementById("regLastName").value;
            const msg = document.getElementById("msg");

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, firstName, lastName })
                });
                if (res.ok) {
                    msg.style.color = "green";
                    msg.innerText = "Uspješna registracija! Sada se prijavite.";
                    setTimeout(() => toggleForm('login'), 2000);
                } else {
                    const errorData = await res.json();
                    msg.style.color = "red";
                    msg.innerText = errorData.error || "Greška pri registraciji.";
                }
            } catch (error) { msg.innerText = "Greška u komunikaciji sa serverom."; }
        }
    </script>
</body>
</html>
